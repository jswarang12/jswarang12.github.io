# ---------------------------------------------------------------------------
# Publications
# ---------------------------------------------------------------------------
# To add a new paper, copy one of the entries under `entries:` below, paste it
# as a new list item, and fill in the fields. No new files or pages needed;
# it will show up on /publications/ (and in the CV) automatically.
#
# Fields:
#   title      - paper title (required)
#   authors    - author list as it should be displayed, e.g. "S. Joshi, et al."
#   venue      - where it was published/submitted, e.g. "CODS-IKDD 2025"
#   year       - publication year (required, used for sorting)
#   date       - full date "YYYY-MM-DD", used for sorting when set (optional,
#                falls back to Jan 1 of `year` if omitted)
#   category   - one of: manuscripts (Journal Articles), conferences
#                (Conference Papers), preprints (Preprints)
#   excerpt    - one or two sentence summary shown in the list
#   paperurl   - link to the PDF / arXiv / DOI page (optional)
#   citation   - full recommended citation string shown under the excerpt
#   highlight  - true to feature this paper in "Selected work" on the home
#                page (optional, keep it to 1-2 papers)
# ---------------------------------------------------------------------------

